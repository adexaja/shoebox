name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...

      - name: Test
        run: go list ./... | grep -v '/examples/' | xargs go test

      - name: Test with coverage
        run: go list ./... | grep -v '/examples/' | xargs go test -covermode=atomic -coverprofile=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          files: ./coverage.out
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Test with race detector
        run: go list ./... | grep -v '/examples/' | xargs go test -race

      - name: Vet
        run: go list ./... | grep -v '/examples/' | xargs go vet
