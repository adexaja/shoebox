version: 2

project_name: shoebox

builds:
  - id: shoeboxd
    main: ./cmd/shoeboxd
    binary: shoeboxd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: shoeboxd
    ids:
      - shoeboxd
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  prerelease: auto
